<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="pTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115566"/>
      <stop offset="100%" stop-color="#4db6ac"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#pBgGrad)"/>
  <circle cx="300" cy="270" r="120" fill="rgba(17, 85, 102, 0.05)" stroke="rgba(77, 182, 172, 0.3)" stroke-width="2"/>

  <!-- Medicine Bottle & Capsule Graphic -->
  <g transform="translate(300, 270)">
    <!-- Bottle -->
    <rect x="-45" y="-55" width="90" height="110" rx="12" fill="#ffffff" stroke="#115566" stroke-width="4"/>
    <rect x="-30" y="-75" width="60" height="20" rx="4" fill="#4db6ac" stroke="#115566" stroke-width="3"/>
    
    <!-- Cross on Bottle -->
    <rect x="-8" y="-20" width="16" height="40" rx="3" fill="#115566"/>
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="#115566"/>

    <!-- Pill Capsule beside -->
    <g transform="translate(48, 25) rotate(35)">
      <rect x="-14" y="-32" width="28" height="64" rx="14" fill="#ffffff" stroke="#115566" stroke-width="3"/>
      <path d="M-14 0 h28 v18 a14 14 0 0 1 -28 0 z" fill="#4db6ac"/>
    </g>
  </g>

  <!-- Labels -->
  <text x="300" y="440" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#115566" text-anchor="middle" letter-spacing="0.5">
    DATA PRODUK FARMASI
  </text>
  <text x="300" y="470" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">
    SIFIT Dinas Kesehatan Provinsi Riau
  </text>
</svg>
