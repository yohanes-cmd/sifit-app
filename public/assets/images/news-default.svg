<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3a46"/>
      <stop offset="50%" stop-color="#115566"/>
      <stop offset="100%" stop-color="#1a6d82"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#80cbc4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="720" cy="80" r="180" fill="rgba(77, 182, 172, 0.08)" />
  <circle cx="100" cy="420" r="140" fill="rgba(77, 182, 172, 0.06)" />

  <!-- Center Icon Graphic -->
  <g transform="translate(400, 200)">
    <!-- Badge circle -->
    <circle cx="0" cy="0" r="64" fill="rgba(255, 255, 255, 0.12)" stroke="url(#mintGrad)" stroke-width="3"/>
    
    <!-- Medical Cross / News Icon -->
    <path d="M-22 -14 h44 v28 h-44 z" fill="none" stroke="#ffffff" stroke-width="3" rx="4"/>
    <path d="M-14 -6 h28" stroke="url(#mintGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-14 2 h20" stroke="url(#mintGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-14 10 h16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Health Star/Cross Accent -->
    <circle cx="28" cy="-28" r="14" fill="#4db6ac"/>
    <path d="M28 -34 v12 M22 -28 h12" stroke="#0b3a46" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Branding Text -->
  <text x="400" y="315" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    WARTA &amp; INFORMASI FARMASI
  </text>
  <text x="400" y="345" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="0.5">
    SIFIT DINAS KESEHATAN PROVINSI RIAU
  </text>
  
  <!-- Subtle Bottom accent line -->
  <rect x="330" y="370" width="140" height="3" fill="url(#mintGrad)" rx="1.5"/>
</svg>
